# ─────────────────────────────────────────────────────────────
# Auto Release  –  Tag → GitHub Release + .exe
# Triggered when you push a version tag, e.g.: v1.0.0
#
# HOW TO USE:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# GitHub will automatically:
#   1. Build the .exe
#   2. Create a GitHub Release
#   3. Attach the .exe to the release
#   4. Auto-generate release notes from your commit history
# ─────────────────────────────────────────────────────────────
name: Release – Publish on Tag

on:
  push:
    tags:
      - "v*.*.*"   # Matches v1.0.0, v2.1.3, v0.9.0-beta, etc.

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write   # Required to create GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for auto release notes

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # ── Build the release .exe ────────────────────────────
      - name: Build .exe with PyInstaller
        run: |
          pyinstaller main.py `
            --name "QT_Login_System" `
            --onefile `
            --windowed `
            --add-data "storage;storage" `
            --add-data "styles;styles" `
            --add-data "ui;ui"

      # ── Extract version from tag (e.g. "v1.0.0") ─────────
      - name: Get release version
        id: version
        run: echo "VERSION=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT

      # ── Create GitHub Release with .exe attached ──────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "QT Login System ${{ steps.version.outputs.VERSION }}"
          files: dist/QT_Login_System.exe
          generate_release_notes: true       # auto-writes changelog from commits
          make_latest: true
